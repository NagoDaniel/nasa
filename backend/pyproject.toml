[project]
name = "space2feed-backend"
version = "0.1.0"
description = "SPACE2FEED / Field Shift backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "orjson>=3.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
scripts = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.32",
]
process = [
    "xarray>=2025.1",
    "netCDF4>=1.7",
    "h5netcdf>=1.4",
    "rasterio>=1.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
package = false
